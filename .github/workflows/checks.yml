name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm test
      - run: python3 -m unittest discover -s test -p 'test_*.py'
      - run: git diff --check
      - name: Check publication tree and history
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 tools/check_public_files.py
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # GitHub's temporary merge has generated identity metadata. Check
            # both complete source histories; the merged tree is scanned above.
            python3 tools/check_public_files.py --history HEAD^1
            python3 tools/check_public_files.py --history HEAD^2
          else
            python3 tools/check_public_files.py --history HEAD
          fi
  native:
    runs-on: ubuntu-latest
    # Ubuntu 24.04 disables the required WebRTC DSP plugin in its package.
    # Use the same native runtime qualified by the disposable Linux proof.
    container: ubuntu:26.04
    timeout-minutes: 10
    steps:
      - name: Install native test dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git \
            python3-gi python3-numpy gir1.2-gstreamer-1.0 \
            gir1.2-gst-plugins-base-1.0 gir1.2-gst-plugins-bad-1.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-nice gstreamer1.0-pulseaudio
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check generated media and process lifecycle without physical audio
        run: |
          python3 native/audio.py --check
          python3 test/native_worker_lifecycle.py
          python3 test/native_audio.py
          python3 test/native_hold.py
          python3 test/native_audio_check.py
          python3 test/native_tone_lifecycle.py
          python3 test/native_wake.py
