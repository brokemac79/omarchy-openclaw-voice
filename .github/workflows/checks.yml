name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: python3 -m unittest discover -s test -p 'test_*.py'
      - run: git diff --check
      - run: python3 tools/check_public_files.py --history HEAD
